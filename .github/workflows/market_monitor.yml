name: Market Monitor Automation

on:
  schedule:
    # 台灣時間 15:30 (UTC 07:30)，週一至週五
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援手動立即觸發測試

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests yfinance pandas

      - name: Execute Monitor Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python monitor.py
